<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<title>MAXI STRIKE</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<canvas id="game"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="hitmarker"></div>
  <div id="scope" class="hidden"></div>
  <div id="damage-flash"></div>
  <div id="dmg-indicators"></div>
  <div id="topbar"><div class="score a" id="score-a">0</div><div id="timer">8:00</div><div class="score b" id="score-b">0</div></div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="killfeed"></div>
  <div id="bottom-left">
    <div id="hp-box"><span class="icon">✚</span><span id="hp">100</span></div>
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="protect">Защита при возрождении</div>
  </div>
  <div id="bottom-right">
    <div id="weapon-slots"></div>
    <div id="weapon-name"></div>
    <div id="ammo"><span id="ammo-mag">30</span><span id="ammo-res">/ 90</span></div>
    <div id="reload-bar"><div id="reload-fill"></div></div>
  </div>
  <div id="center-msg"></div>
  <div id="death-screen" class="hidden"><div class="killed-by">Вас убил <b id="killer-name"></b></div><div id="respawn-timer"></div></div>
  <div id="scoreboard" class="hidden"></div>
  <div id="fps"></div>
  <div id="touch-ui"></div>
</div>

<!-- ============ МЕНЮ ============ -->
<div id="menu">
  <div class="topline">
    <div class="logo">MAXI<span>STRIKE</span></div>
    <div class="credits"><span class="coin">◆</span><span id="credits">0</span></div>
  </div>

  <!-- Главный экран -->
  <section class="screen active" id="screen-main">
    <div class="main-buttons">
      <button class="big primary" data-goto="play">ИГРАТЬ</button>
      <button class="big" data-goto="arsenal">АРСЕНАЛ</button>
      <button class="big" data-goto="cases">КЕЙСЫ</button>
      <button class="big" data-goto="settings">НАСТРОЙКИ</button>
    </div>
    <div class="profile-card" id="profile-card"></div>
  </section>

  <!-- Настройка матча -->
  <section class="screen" id="screen-play">
    <div class="panel">
      <h2><button class="back" data-goto="main">‹</button>Бой с ботами</h2>
      <div class="row"><label>Режим</label><div class="seg" data-opt="mode"></div></div>
      <div class="row"><label>Карта</label><div class="maps" id="map-cards"></div></div>
      <div class="row"><label id="per-team-label">Игроков в команде</label><div class="seg" data-opt="perTeam"></div></div>
      <div class="row"><label>Сложность ботов</label><div class="seg" data-opt="difficulty"></div></div>
      <div class="row"><label>Основное оружие</label><div class="seg" data-opt="primary"></div></div>
      <div class="row"><label>Убийств до победы</label><div class="seg" data-opt="killsToWin"></div></div>
      <div class="row"><label>Время матча</label><div class="seg" data-opt="minutes"></div></div>
      <button class="big primary wide" id="start-btn">В БОЙ</button>
    </div>
  </section>

  <!-- Арсенал (скины) -->
  <section class="screen" id="screen-arsenal">
    <div class="panel side">
      <h2><button class="back" data-goto="main">‹</button>Арсенал</h2>
      <div class="tabs" id="arsenal-tabs"></div>
      <div class="skin-grid" id="skin-grid"></div>
    </div>
  </section>

  <!-- Кейсы -->
  <section class="screen" id="screen-cases">
    <div class="panel">
      <h2><button class="back" data-goto="main">‹</button>Кейсы</h2>
      <p class="hint">Кредиты ◆ дают за убийства и победы. Повторный скин автоматически продаётся.</p>
      <div class="case-list" id="case-list"></div>
    </div>
  </section>

  <!-- Настройки -->
  <section class="screen" id="screen-settings">
    <div class="panel">
      <h2><button class="back" data-goto="main">‹</button>Настройки</h2>
      <div class="tabs" id="settings-tabs"></div>
      <div id="settings-body"></div>
    </div>
  </section>
</div>

<!-- Открытие кейса -->
<div id="case-open" class="overlay hidden">
  <div class="roulette"><div class="strip" id="roulette-strip"></div><div class="marker"></div></div>
  <div class="case-result" id="case-result"></div>
  <button class="big primary" id="case-close">Забрать</button>
</div>

<!-- Пауза -->
<div id="pause" class="overlay hidden">
  <div class="panel small">
    <h2>Пауза</h2>
    <button class="big primary wide" id="resume-btn">Продолжить</button>
    <button class="big wide" id="pause-settings">Настройки</button>
    <button class="big wide danger" id="quit-btn">Выйти в меню</button>
    <p class="hint" id="pause-hint"></p>
  </div>
</div>

<!-- Итоги матча -->
<div id="end" class="overlay hidden">
  <div class="panel">
    <h2 id="end-title">Победа</h2>
    <div id="end-stats"></div>
    <button class="big primary wide" id="end-again">Ещё раз</button>
    <button class="big wide" id="end-menu">В меню</button>
  </div>
</div>

<!-- Редактор кнопок -->
<div id="layout-editor" class="overlay hidden">
  <div id="le-area"></div>
  <div class="le-panel">
    <div id="le-selected">Выберите кнопку</div>
    <label>Размер <input type="range" id="le-size" min="36" max="220" step="2"></label>
    <label>Прозрачность <input type="range" id="le-opacity" min="0.15" max="1" step="0.05"></label>
    <label class="chk"><input type="checkbox" id="le-firel"> Левая кнопка огня</label>
    <div class="le-buttons"><button id="le-reset">Сброс</button><button id="le-cancel">Отмена</button><button class="primary" id="le-save">Сохранить</button></div>
  </div>
</div>

<div id="rotate-hint">Поверните устройство горизонтально ⟲</div>
<div id="loading">Загрузка…</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
